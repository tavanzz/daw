name: Update key
description: >
  Writes the private key that signs this run's update information to
  $RUNNER_TEMP/update-key.txt: the repository's (secret DAW_UPDATE_PRIVATE_KEY) or this
  run's throwaway one (kept by the prepare job for a day).
inputs:
  throwaway:
    description: "true when the run has no key of its own"
    required: true
  private-key:
    description: "the secret DAW_UPDATE_PRIVATE_KEY"
    required: false
runs:
  using: composite
  steps:
    - name: Fetch the throwaway key
      if: inputs.throwaway == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: throwaway-update-key
        path: ${{ runner.temp }}/throwaway-key
    - name: Write the key
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        if [ "${{ inputs.throwaway }}" = "true" ]; then
          cp "$RUNNER_TEMP/throwaway-key/update-key.txt" "$RUNNER_TEMP/update-key.txt"
        else
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/update-key.txt"
        fi
        chmod 600 "$RUNNER_TEMP/update-key.txt"
