name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-24.04
            preset: debug
          # Release only on Linux: warnings that appear only with the optimiser
          # (GCC in particular) are caught on the cheapest runner.
          - name: Linux GCC Release
            os: ubuntu-24.04
            preset: release
          # RealtimeSanitizer (Clang 20+) catches malloc, locks, blocking calls and
          # file I/O in audio-thread code under test, beyond the operator new count.
          - name: Linux Clang RealtimeSanitizer
            os: ubuntu-24.04
            preset: linux-rtsan
            llvm: 22
            cmake-args: -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          - name: macOS Apple Clang Debug
            os: macos-15
            preset: debug
          - name: Windows MSVC Debug
            os: windows-2025
            preset: debug
            # Other compilers (MinGW, LLVM) are also on the runner's PATH.
            cmake-args: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the LLVM apt repository (Linux, Clang jobs)
        if: matrix.llvm
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.llvm }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ -n "${{ matrix.llvm }}" ]; then
            sudo apt-get install -y --no-install-recommends \
              clang-${{ matrix.llvm }} libclang-rt-${{ matrix.llvm }}-dev
          fi
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Cache dependency archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/deps
          key: deps-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
